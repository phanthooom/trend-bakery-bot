<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Trend Bakery</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        function expandApp() {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (tg) {
            try { tg.ready(); } catch(e) {}
            try { tg.expand(); } catch(e) {}
            try { tg.disableVerticalSwipes(); } catch(e) {}
            try { tg.setHeaderColor && tg.setHeaderColor('#ffffff'); } catch(e) {}
            try { tg.setBackgroundColor && tg.setBackgroundColor('#ffffff'); } catch(e) {}
            try {
              if (typeof tg.requestFullscreen === 'function' && !tg.isFullscreen) {
                tg.requestFullscreen();
              }
            } catch(e) {}
          }
        }
        expandApp();
        document.addEventListener('DOMContentLoaded', expandApp);
        window.addEventListener('load', expandApp);
        [50, 150, 300, 600, 1000, 1500].forEach(function(d) {
          setTimeout(expandApp, d);
        });
        ['touchstart', 'pointerdown', 'click'].forEach(function(ev) {
          window.addEventListener(ev, expandApp, { passive: true });
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
